<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f17" />
  <title>MIA — Modelo IA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">MODELO IA // V1</span>
        <h1>MIA</h1>
      </div>
      <div class="status"><span class="dot"></span> ONLINE</div>
    </header>

    <main class="game">
      <section class="stage" id="stage" data-scene="studio">
        <div class="scene-glow"></div>
        <div class="scene-label" id="sceneLabel">ESTÚDIO</div>

        <div class="character-wrap" id="characterWrap">
          <svg class="character" viewBox="0 0 360 620" role="img" aria-label="Mia, personagem virtual">
            <defs>
              <linearGradient id="hair" x1="0" x2="1">
                <stop offset="0" stop-color="#2c1a18" />
                <stop offset="1" stop-color="#5a3028" />
              </linearGradient>
              <linearGradient id="skin" x1="0" x2="1">
                <stop offset="0" stop-color="#e9b18f" />
                <stop offset="1" stop-color="#f3c2a2" />
              </linearGradient>
            </defs>
            <ellipse cx="180" cy="600" rx="92" ry="16" fill="rgba(0,0,0,.25)" />
            <path d="M108 182 C78 142 88 54 180 44 C278 52 286 146 252 190 L241 311 L113 311 Z" fill="url(#hair)" />
            <ellipse cx="180" cy="154" rx="78" ry="93" fill="url(#skin)" />
            <path d="M104 148 C107 72 137 56 181 55 C229 60 257 88 256 150 C231 120 216 96 191 95 C156 113 128 120 104 148Z" fill="url(#hair)" />
            <ellipse cx="151" cy="156" rx="7" ry="5" fill="#241914" />
            <ellipse cx="210" cy="156" rx="7" ry="5" fill="#241914" />
            <path d="M169 193 Q181 204 193 193" fill="none" stroke="#9f4b55" stroke-width="4" stroke-linecap="round" />
            <path d="M153 223 Q180 239 207 223 L211 268 L149 268 Z" fill="url(#skin)" />
            <g id="outfitBody">
              <path id="top" d="M107 275 Q180 244 253 275 L283 425 Q236 456 180 456 Q124 456 77 425 Z" fill="#d9d9de" />
              <path id="skirt" d="M103 432 L257 432 L288 555 L72 555 Z" fill="#222633" />
            </g>
            <path d="M108 289 Q78 322 72 405" fill="none" stroke="url(#skin)" stroke-width="28" stroke-linecap="round" />
            <path d="M252 289 Q282 322 288 405" fill="none" stroke="url(#skin)" stroke-width="28" stroke-linecap="round" />
            <path d="M133 548 L129 596" stroke="#d99d7e" stroke-width="31" stroke-linecap="round" />
            <path d="M227 548 L231 596" stroke="#d99d7e" stroke-width="31" stroke-linecap="round" />
          </svg>
          <div class="speech" id="speech">Oi. Eu sou a Mia ✨</div>
        </div>

        <div class="hud">
          <div class="hud-item"><span>HUMOR</span><strong id="moodText">Animada</strong></div>
          <div class="hud-item grow"><span>AFINIDADE</span><div class="meter"><i id="affinityBar"></i></div></div>
          <div class="hud-item"><strong id="affinityValue">12</strong><span>/100</span></div>
        </div>
      </section>

      <section class="panel">
        <nav class="tabs" aria-label="Menu">
          <button class="tab active" data-tab="chat">Conversar</button>
          <button class="tab" data-tab="style">Visual</button>
          <button class="tab" data-tab="scene">Cenário</button>
        </nav>

        <div class="tab-panel active" id="tab-chat">
          <div class="chat" id="chatLog">
            <div class="msg mia"><b>MIA</b><span>Chegou cedo hoje 😌 O que vamos fazer?</span></div>
          </div>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" autocomplete="off" maxlength="180" placeholder="Fale com a Mia..." />
            <button type="submit">Enviar</button>
          </form>
          <div class="quick-actions">
            <button data-message="Faz uma pose para foto">📸 Pose</button>
            <button data-message="Como você está hoje?">💬 Humor</button>
            <button data-message="Vamos trocar seu look">👗 Look</button>
          </div>
        </div>

        <div class="tab-panel" id="tab-style">
          <h2>Looks</h2>
          <div class="cards">
            <button class="option-card selected" data-outfit="classic"><span>🤍</span><b>Clássico</b><small>Clean editorial</small></button>
            <button class="option-card" data-outfit="night"><span>🖤</span><b>Night</b><small>Preto premium</small></button>
            <button class="option-card" data-outfit="sport"><span>💜</span><b>Sport</b><small>Street fitness</small></button>
            <button class="option-card" data-outfit="red"><span>❤️</span><b>Red</b><small>Impacto</small></button>
          </div>
        </div>

        <div class="tab-panel" id="tab-scene">
          <h2>Cenários</h2>
          <div class="cards">
            <button class="option-card selected" data-scene="studio"><span>💡</span><b>Estúdio</b><small>Luz editorial</small></button>
            <button class="option-card" data-scene="city"><span>🌃</span><b>Cidade</b><small>Noite urbana</small></button>
            <button class="option-card" data-scene="beach"><span>🌅</span><b>Praia</b><small>Golden hour</small></button>
            <button class="option-card" data-scene="room"><span>🛋️</span><b>Quarto</b><small>Cozy</small></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
