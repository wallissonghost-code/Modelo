<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <title>Live+ Test Game</title>
  <link rel="stylesheet" href="./styles.css?v=1" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <strong>Live+ Test Game</strong>
        <small>Conector</small>
      </div>
      <button id="panelButton" class="panel-button" type="button">Painel</button>
    </header>

    <section class="status-grid">
      <article><span>PAINEL</span><strong id="panelStatus">Offline</strong></article>
      <article><span>TRANSPORTE</span><strong id="transportStatus">offline</strong></article>
      <article><span>RECEBIDOS</span><strong id="receivedCount">0</strong></article>
      <article><span>EXECUTADOS</span><strong id="executedCount">0</strong></article>
    </section>

    <section class="game" id="gameArea" aria-label="Área do jogo">
      <div class="sky"></div>
      <div id="player" class="player" aria-label="Boneco">
        <div class="head"></div>
        <div class="body"></div>
        <div class="legs"><i></i><i></i></div>
      </div>
      <div class="ground"></div>
      <div id="actionToast" class="action-toast">Aguardando comando…</div>
    </section>

    <section class="controls">
      <h2>Teste local</h2>
      <div class="buttons">
        <button data-action="walk_left">← Andar</button>
        <button data-action="jump">Pular</button>
        <button data-action="walk_right">Andar →</button>
        <button data-action="stop">Parar</button>
      </div>
      <p>Esses mesmos comandos ficam disponíveis para o painel.</p>
    </section>

    <section class="events">
      <div class="events-head"><h2>Últimos comandos</h2><button id="clearLog" type="button">Limpar</button></div>
      <div id="eventLog" class="event-log"><div class="empty">Nenhum comando recebido.</div></div>
    </section>
  </main>

  <div id="panelModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button id="closePanel" class="close" type="button">×</button>
      <h2>Conector</h2>
      <p>Cole o código de 8 caracteres ou o ticket LIVEPLUS1.</p>
      <input id="panelCode" autocomplete="off" placeholder="ABCD-EFGH" />
      <button id="connectPanel" class="connect" type="button">Conectar</button>
      <div id="pairMessage" class="pair-message">Aguardando conexão.</div>
    </div>
  </div>

  <script src="./config.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/gh/wallissonghost-code/projeto-daniel@14c423787fc4d65fc01cb94c87d47850bc41d5d5/sdk/liveplus-game-sdk-v1.js"></script>
  <script src="./game.js?v=1"></script>
  <script src="./panel-bridge.js?v=1"></script>
</body>
</html>
